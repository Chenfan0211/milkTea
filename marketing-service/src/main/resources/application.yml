# =============================================================
# 营销服务配置（第 5 期）
#
# 职责：优惠券、积分（时光币）、礼品卡、储值、评论、推荐、会员等级。
# 端口 8083，由网关路由。
#
# 数据访问说明：与 server 共用同一 MySQL 实例。
# 积分 / 余额字段位于 app_user 表，属共享读写（见 pom 注释的决策依据）。
# =============================================================
server:
  port: ${MARKETING_SERVICE_PORT:8083}

spring:
  application:
    name: wuling-marketing-service
  # ---------- 数据库连接池（P0 统一显式配置） ----------
  # 默认 Spring Boot 的 maximum-pool-size=10、connection-timeout=30s 在
  # 高并发下会导致「连接池耗尽 -> 30s 死等 -> 雪崩」。这里统一显式收紧：
  #   - connection-timeout 降到 3s：拿不到连接快速失败，而非长时间挂起；
  #   - maximum-pool-size 按单实例 20：与 Tomcat 默认 200 线程匹配的合理值；
  #   - minimum-idle 5：减少冷启动抖动。
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      validation-timeout: 3000

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    # 请求日志：每次调用的方法/路径/参数(脱敏)/耗时/状态码
    REQUEST: INFO
  # 日志输出格式：带 traceId 便于串联同一次调用的多行日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

app:
  # ---------- 微信小程序营销订阅消息 ----------
  wx:
    app-id: ${WX_APP_ID:wx7d78d69cd175812e}
    app-secret: ${WX_APP_SECRET:}
    access-token-url: ${WX_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
    subscribe-send-url: ${WX_SUBSCRIBE_SEND_URL:https://api.weixin.qq.com/cgi-bin/message/subscribe/send}
    http-timeout-ms: ${WX_MINIAPP_HTTP_TIMEOUT_MS:3000}
    subscribe:
      enabled: ${WX_MARKETING_SUBSCRIBE_ENABLED:true}
      points-change:
        template-id: ${WX_POINTS_CHANGE_TEMPLATE_ID:W69-LPXpDxs7pPiN_0I_75I0XqXJWPkL4XYCS26CopM}
        page: ${WX_POINTS_CHANGE_PAGE:pages/points-detail/points-detail}
        miniprogram-state: ${WX_MARKETING_SUBSCRIBE_MINIPROGRAM_STATE:formal}
      points-exchange:
        template-id: ${WX_POINTS_EXCHANGE_TEMPLATE_ID:6DKXp9_Bx4gYaj0CaUeTp6rXyKIF3AZrrmSR5CwHjfE}
        page: ${WX_POINTS_EXCHANGE_PAGE:pages/exchange-records/exchange-records}
        miniprogram-state: ${WX_MARKETING_SUBSCRIBE_MINIPROGRAM_STATE:formal}
      stored-value-recharge:
        template-id: ${WX_STORED_VALUE_RECHARGE_TEMPLATE_ID:uvD7jHuIZ1bpXIA-HfqHXfScW0j2zIYBCYWHR7emFJI}
        page: ${WX_STORED_VALUE_RECHARGE_PAGE:pages/stored-value-records/stored-value-records}
        miniprogram-state: ${WX_MARKETING_SUBSCRIBE_MINIPROGRAM_STATE:formal}
      balance-change:
        template-id: ${WX_BALANCE_CHANGE_TEMPLATE_ID:uvD7jHuIZ1bpXIA-HfqHXQGw6MCweamgsPFK-MIVne0}
        page: ${WX_BALANCE_CHANGE_PAGE:pages/stored-value-records/stored-value-records}
        miniprogram-state: ${WX_MARKETING_SUBSCRIBE_MINIPROGRAM_STATE:formal}
      coupon-arrival:
        template-id: ${WX_COUPON_ARRIVAL_TEMPLATE_ID:en0sN5PvHmq9DyiZIjaH_x5-bGpisdD3boCqMa_wx5g}
        page: ${WX_COUPON_ARRIVAL_PAGE:pages/coupon-list/coupon-list}
        miniprogram-state: ${WX_MARKETING_SUBSCRIBE_MINIPROGRAM_STATE:formal}
      coupon-expiry:
        template-id: ${WX_COUPON_EXPIRY_TEMPLATE_ID:oaeDu3ZTFfzrrPQvFliAMRHdMNg19KW2V8xhvCU5MSo}
        page: ${WX_COUPON_EXPIRY_PAGE:pages/coupon-list/coupon-list}
        miniprogram-state: ${WX_MARKETING_SUBSCRIBE_MINIPROGRAM_STATE:formal}
    coupon-expiry:
      enabled: ${WX_COUPON_EXPIRY_ENABLED:true}
      cron: '${WX_COUPON_EXPIRY_CRON:0 0 10 * * ?}'
      days-before: ${WX_COUPON_EXPIRY_DAYS_BEFORE:3}
      batch-size: ${WX_COUPON_EXPIRY_BATCH_SIZE:500}

  # 储值订单超时关单兜底扫描（P0：储值订单原本无超时关单机制，每分钟扫一次超 15 分钟未支付）
  stored-value-timeout-scan:
    enabled: true
    cron: '0 * * * * ?'
    batch-size: 200
  # 优惠券「过期未用」归档扫描（兜底：myCoupons 的「已过期」是现算的，本任务只为状态可索引/可统计）
  coupon-expire-scan:
    enabled: true
    cron: '0 */5 * * * ?'
    batch-size: 500
  # 优惠券数据完整性巡检（只告警不自动改数）：已使用但无订单号 / 同用户同模板重复持有
  coupon-integrity-check:
    enabled: true
    cron: '0 */10 * * * ?'
  # 事务内事件 outbox 扫描发布器（储值/优惠券/分账/冲正等最终一致事件）
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:1000}
    max-retries: ${OUTBOX_MAX_RETRIES:8}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lock-timeout-ms: ${OUTBOX_LOCK_TIMEOUT_MS:300000}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  jwt:
    # 与本服务无关的签发参数，但 MiniAppTokenProvider（security-common）需要它存在；
    # 校验令牌只需 secret，TTL 仅用于签发场景
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
