# =============================================================
# 营销服务配置（第 5 期）
#
# 职责：优惠券、积分（时光币）、礼品卡、储值、评论、推荐、会员等级。
# 端口 8083，由网关路由。
#
# 数据访问说明：与 server 共用同一 MySQL 实例。
# 积分 / 余额字段位于 app_user 表，属共享读写（见 pom 注释的决策依据）。
# =============================================================
server:
  port: ${MARKETING_SERVICE_PORT:8083}

spring:
  application:
    name: wuling-marketing-service
  # ---------- 数据库连接池（P0 统一显式配置） ----------
  # 默认 Spring Boot 的 maximum-pool-size=10、connection-timeout=30s 在
  # 高并发下会导致「连接池耗尽 -> 30s 死等 -> 雪崩」。这里统一显式收紧：
  #   - connection-timeout 降到 3s：拿不到连接快速失败，而非长时间挂起；
  #   - maximum-pool-size 按单实例 20：与 Tomcat 默认 200 线程匹配的合理值；
  #   - minimum-idle 5：减少冷启动抖动。
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      validation-timeout: 3000

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    # 请求日志：每次调用的方法/路径/参数(脱敏)/耗时/状态码
    REQUEST: INFO
  # 日志输出格式：带 traceId 便于串联同一次调用的多行日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

app:
  # 储值订单超时关单兜底扫描（P0：储值订单原本无超时关单机制，每分钟扫一次超 15 分钟未支付）
  stored-value-timeout-scan:
    enabled: true
    cron: '0 * * * * ?'
    batch-size: 200
  # 事务内事件 outbox 扫描发布器（储值/优惠券/分账/冲正等最终一致事件）
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:1000}
    max-retries: ${OUTBOX_MAX_RETRIES:8}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lock-timeout-ms: ${OUTBOX_LOCK_TIMEOUT_MS:300000}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  jwt:
    # 与本服务无关的签发参数，但 MiniAppTokenProvider（security-common）需要它存在；
    # 校验令牌只需 secret，TTL 仅用于签发场景
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
