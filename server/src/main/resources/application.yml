server:
  port: 8080

spring:
  application:
    name: wuling-server
  profiles:
    active: dev
  # ---------- Nacos 服务注册（第 3 期）----------
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  # 微信小程序配置
  # app-secret 请通过环境变量 WX_APP_SECRET 注入，不要写进仓库
  wx:
    app-id: ${WX_APP_ID:wx7d78d69cd175812e}
    app-secret: ${WX_APP_SECRET:}
    code2session-url: https://api.weixin.qq.com/sns/jscode2session
  # Redis 命名空间与库号映射
  # mode=single  ：按 database 映射连接不同 db（auth/sms/cache/biz）
  # mode=cluster ：忽略 database（集群仅支持 db0），统一走 key 前缀，保证可扩展
  redis:
    mode: ${REDIS_MODE:single}
    database:
      auth: ${REDIS_DB_AUTH:0}
      sms: ${REDIS_DB_SMS:1}
      cache: ${REDIS_DB_CACHE:2}
      biz: ${REDIS_DB_BIZ:3}
  # 消息队列配置
  mq:
    # 订单超时时间（毫秒），默认 15 分钟
    order-timeout-ms: ${MQ_ORDER_TIMEOUT_MS:900000}
    # 消费失败最大重试次数，超过后转入死信队列
    max-retry: ${MQ_MAX_RETRY:3}
    # 消费端并发数
    consumer-concurrency: ${MQ_CONSUMER_CONCURRENCY:2}
    # 单次预取消息数
    prefetch-count: ${MQ_PREFETCH_COUNT:10}
  # 短信通道配置（降级登录方案）
  # enabled=false 时使用 ConsoleSmsProvider（验证码输出到日志，不真实发送）
  # 上线接入腾讯云后：enabled=true 并配置 sdk-app-id / secret-id / secret-key / sign-name / template-id
  sms:
    enabled: ${SMS_ENABLED:false}
    sdk-app-id: ${SMS_SDK_APP_ID:}
    secret-id: ${SMS_SECRET_ID:}
    secret-key: ${SMS_SECRET_KEY:}
    sign-name: ${SMS_SIGN_NAME:}
    template-id: ${SMS_TEMPLATE_ID:}
  # ---------- 告警通道（第 9 期）----------
  # 当前为日志通道（生产 25 端口被封，接 SMTP 需邮件授权码）
  alert:
    log-file: ${ALERT_LOG_FILE:/opt/wuling/logs/alerts.log}
    flag-file: ${ALERT_FLAG_FILE:/opt/wuling/logs/ALERT_PENDING}
  # ---------- 对账任务（第 8 期）----------
  reconcile:
    enabled: ${RECONCILE_ENABLED:true}
    cron: ${RECONCILE_CRON:0 10 * * * ?}
  jwt:
    # P1 安全修复：不再提供仓库默认密钥。
    # 原默认值写在仓库里，等同于公开密钥，任何人可离线伪造管理端 / 小程序 token。
    # 现改为必须由环境变量 JWT_SECRET 注入（Base64、>=32 字节），
    # 未注入时 JwtTokenProvider 启动即失败（fail-fast）。
    secret: ${JWT_SECRET:}
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
  # 支付回调签名（P0 安全修复）
  # 密钥由 PAY_CALLBACK_SECRET 注入，缺失时服务拒绝启动
  pay:
    callback-secret: ${PAY_CALLBACK_SECRET:}
    # 回调时间戳允许漂移窗口（毫秒），默认 5 分钟，用于防重放
    callback-tolerance-ms: ${PAY_CALLBACK_TOLERANCE_MS:300000}

# 告警通道配置（第 9 期）
# 当前为日志通道；生产 25 端口被封，接 SMTP 需邮件授权码（见 docs）
