# =============================================================
# 用户服务配置（第 11 期）
#
# 职责：小程序用户、微信登录、短信验证码、头像昵称、定位。
# 端口 8085，由网关路由。
# =============================================================
server:
  port: ${USER_SERVICE_PORT:8085}

spring:
  application:
    name: wuling-user-service
  servlet:
    multipart:
      # 舌象图片上传：单文件 5MB、整请求 6MB，与 file-service/网关保持一致
      max-file-size: 5MB
      max-request-size: 6MB
  # ---------- 数据库连接池（P0 统一显式配置） ----------
  # 默认 Spring Boot 的 maximum-pool-size=10、connection-timeout=30s 在
  # 高并发下会导致「连接池耗尽 -> 30s 死等 -> 雪崩」。这里统一显式收紧：
  #   - connection-timeout 降到 3s：拿不到连接快速失败，而非长时间挂起；
  #   - maximum-pool-size 按单实例 20：与 Tomcat 默认 200 线程匹配的合理值；
  #   - minimum-idle 5：减少冷启动抖动。
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      validation-timeout: 3000

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  # 内部服务调用：不经网关（网关只路由 /api/v1/** 与 /auth/**），仅回环/内网可达。
  internal:
    # true = 本地 dev 直连 127.0.0.1；false = 通过 Nacos 服务名负载均衡
    direct-connect: ${APP_INTERNAL_DIRECT_CONNECT:false}
    # product-service 基址：舌象报告按商品名匹配商城商品卡
    product-base: ${INTERNAL_PRODUCT_BASE:http://wuling-product-service}
  # 舌象第三方服务：secret 必须由环境变量 TONGUE_APP_SECRET 注入，仓库不保存真实值
  tongue:
    base-url: ${TONGUE_BASE_URL:https://linkhealth.tcmbrain.com/hzsg}
    app-key: ${TONGUE_APP_KEY:wlsg}
    app-secret: ${TONGUE_APP_SECRET:}
    app-id: ${TONGUE_APP_ID:100101}
    connect-timeout: ${TONGUE_CONNECT_TIMEOUT:10s}
    detection-read-timeout: ${TONGUE_DETECTION_READ_TIMEOUT:60s}
    report-read-timeout: ${TONGUE_REPORT_READ_TIMEOUT:30s}
    file-base-url: ${TONGUE_FILE_BASE_URL:http://wuling-file-service}
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  wx:
    app-id: ${WX_APP_ID:wx7d78d69cd175812e}
    app-secret: ${WX_APP_SECRET:}
    code2session-url: https://api.weixin.qq.com/sns/jscode2session
  sms:
    enabled: ${SMS_ENABLED:false}
    sdk-app-id: ${SMS_SDK_APP_ID:}
    secret-id: ${SMS_SECRET_ID:}
    secret-key: ${SMS_SECRET_KEY:}
    sign-name: ${SMS_SIGN_NAME:}
    template-id: ${SMS_TEMPLATE_ID:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
  redis:
    mode: ${REDIS_MODE:single}
    database:
      auth: ${REDIS_DB_AUTH:0}
      sms: ${REDIS_DB_SMS:1}
      cache: ${REDIS_DB_CACHE:2}
      biz: ${REDIS_DB_BIZ:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    # 请求日志：每次调用的方法/路径/参数(脱敏)/耗时/状态码
    REQUEST: INFO
  # 日志输出格式：带 traceId 便于串联同一次调用的多行日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
