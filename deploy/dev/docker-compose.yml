# 五零时光 · 本地开发中间件
# 口令从同目录 .env 读取（见 .env.example），请勿把真实口令写入本文件。
services:
  mysql:
    image: mysql:8.0
    container_name: wuling-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: wuling
      MYSQL_USER: wuling
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wuling-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD --appendonly yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wuling-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: wuling
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ---------- Nacos 注册中心 / 配置中心（第 3 期）----------
  # 说明：standalone 模式 + 内嵌 Derby，适合单机；生产如需高可用应改集群 + MySQL 存储
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: wuling-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 关闭鉴权仅限本地开发；生产必须开启并配置强口令
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      # 8848 主端口；9848/9849 为 gRPC 端口，客户端 v2.x 必需
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql-data: {}
  redis-data: {}
  rabbitmq-data: {}
  nacos-data: {}
  nacos-logs: {}
