# =============================================================
# ClamAV 病毒扫描服务 — 生产中间件 compose 片段（可直接复制）
#
# 用法：把下面的 clamav 服务块复制到
#   /opt/wuling/deploy/docker-compose.yml
# 的 services: 段内（与 mysql/redis/rabbitmq/nacos 平级），
# 并把 clamav-data 加入文件末尾的 volumes: 段。
#
# 重要前提：
#   1. clamav 容器必须与后端服务同在 wuling-net 网络，
#      由 docker/deploy-backend.sh 的 preflight 自动接入；
#   2. file-service 已通过 CLAMAV_HOST=wuling-clamav 访问；
#   3. 首次启动 clamav 会拉取病毒库（freshclam），耗时较长，
#      healthcheck 的 start_period=120s 已预留足够时间。
# =============================================================

  # ---------- ClamAV 病毒扫描（P2）----------
  # clamd 守护进程，提供 TCP 3310 端口 INSTREAM 流式扫描，
  # 供 file-service 在上传图片时做病毒检测。
  clamav:
    image: clamav/clamav:stable
    container_name: wuling-clamav
    restart: unless-stopped
    # 病毒库定期更新（freshclam 守护进程随容器启动）
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    ports:
      # 仅监听回环：由后端容器通过 wuling-net 内部网络访问，不暴露公网
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    # 注意：不写 networks 字段，与 mysql/redis 等中间件容器一致。
    # wuling-net 由 docker/deploy-backend.sh 的 preflight 用
    # 「docker network connect wuling-net wuling-clamav」动态接入。
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

# =============================================================
# 同时需要在文件末尾 volumes: 段加入（若尚无 clamav-data）：
# =============================================================

#   clamav-data: {}
