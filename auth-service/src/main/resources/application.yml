# =============================================================
# 认证服务配置（第 4 期：阶段 B —— 业务迁移完成）
#
# 职责：管理端登录、JWT 签发/刷新/校验、登录限流与审计。
# 独立数据库连接：与单体 server 共用同一 MySQL 实例，
# 第 4 期后续可拆分为独立库（wuling_auth）。
# =============================================================
server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: wuling-auth-service
  # ---------- 数据库连接池（P0 统一显式配置） ----------
  # 默认 Spring Boot 的 maximum-pool-size=10、connection-timeout=30s 在
  # 高并发下会导致「连接池耗尽 -> 30s 死等 -> 雪崩」。这里统一显式收紧：
  #   - connection-timeout 降到 3s：拿不到连接快速失败，而非长时间挂起；
  #   - maximum-pool-size 按单实例 20：与 Tomcat 默认 200 线程匹配的合理值；
  #   - minimum-idle 5：减少冷启动抖动。
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      validation-timeout: 3000

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  jwt:
    # 与 server / gateway 共用同一密钥；缺失即拒绝启动
    secret: ${JWT_SECRET:}
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
  redis:
    mode: ${REDIS_MODE:single}
    database:
      auth: ${REDIS_DB_AUTH:0}
      sms: ${REDIS_DB_SMS:1}
      cache: ${REDIS_DB_CACHE:2}
      biz: ${REDIS_DB_BIZ:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    # 请求日志：每次调用的方法/路径/参数(脱敏)/耗时/状态码
    REQUEST: INFO
  # 日志输出格式：带 traceId 便于串联同一次调用的多行日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
