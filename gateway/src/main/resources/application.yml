# =============================================================
# API 网关配置（第 3 期）
#
# 端口 8080：对外统一入口，与原单体一致，前端 BASE_URL 无需改动。
# 路由策略：通过 Nacos 服务名（lb://）寻址，不写死 IP。
# =============================================================
server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: wuling-gateway

  # ---------- Nacos 服务发现 ----------
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 服务名带前缀，便于在 Nacos 控制台按项目筛选
        service: ${spring.application.name}
        # 网关是 WebFlux 响应式栈，服务注册与 Netty 启动并发进行，
        # gRPC 长连接可能尚未就绪就被调用（报 Client not connected, status:STARTING）。
        # 这里延长连接与注册超时，并允许启动期注册失败（后台会持续重试），
        # 避免网关因注册时序问题整体启动失败。
        register-enabled: true
        failure-tolerance-enabled: true
        # gRPC 连接等待时间（毫秒）
        timeout: 10000

    # ---------- 路由 ----------
    gateway:
      # 路由定义见下方 routes
      routes:
        # 认证路由：登录 / 刷新令牌
        #
        # 第 4 期（阶段 B）已完成：AuthController 迁移至 auth-service，
        # 此路由改指 auth-service。前端 BASE_URL 无需改动。
        - id: auth-route
          uri: lb://wuling-auth-service
          predicates:
            - Path=/auth/**

        # 文件服务：上传与校验
        - id: file-service
          uri: lb://wuling-file-service
          predicates:
            - Path=/api/v1/files/**

        # ---------- 后端路由信息（管理端路由初始化）----------
        # RouteController 位于 server，供前端按需拉取路由表。
        # 原缺失该路由导致 /route/** 返回 404（前端 static 模式未暴露）。
        - id: legacy-route
          uri: lb://wuling-server
          predicates:
            - Path=/route/**
        # ---------- 用户服务（第 11 期拆分）----------
        # 顺序敏感：必须排在 /api/v1/** 通配之前。
        - id: user-auth
          uri: lb://wuling-user-service
          predicates:
            - Path=/api/v1/app/auth/**
        # ---------- 营销服务（第 5 期拆分）----------
        #
        # 注意顺序：Spring Cloud Gateway 按定义顺序匹配，先命中先返回。
        # 营销的这些前缀必须排在下方 server 的通配 /api/v1/** 之前，
        # 否则会被 server 抢先匹配。
        - id: marketing-app
          uri: lb://wuling-marketing-service
          predicates:
            - Path=/api/v1/app/coupons,/api/v1/app/users/**,/api/v1/app/stored-value/**,/api/v1/app/gift-cards/**,/api/v1/app/points/**,/api/v1/app/member-levels,/api/v1/app/comments
        - id: marketing-admin
          uri: lb://wuling-marketing-service
          predicates:
            - Path=/api/v1/admin/marketing/**,/api/v1/admin/signin-rule,/api/v1/admin/referral-config

        # ---------- 交易服务（第 7 期拆分）----------
        # 同样需排在 /api/v1/** 通配之前。
        - id: trade-app
          uri: lb://wuling-trade-service
          predicates:
            - Path=/api/v1/app/orders/**,/api/v1/app/orders,/api/v1/app/payments/**
        - id: trade-admin
          uri: lb://wuling-trade-service
          predicates:
            - Path=/api/v1/admin/trade/**
        # 门店核销（记录查询 / 待核销池 / 执行核销）在 trade-service，
        # 但控制器路径落在 /api/v1/app/workbench/store/{id}/verify*，
        # 与 legacy-server 的 /api/v1/app/workbench/** 前缀冲突。
        # 顺序敏感：必须排在下方 legacy-server 通配之前，否则会被
        # 兜底路由转发到 server，导致 NoResourceFoundException（HTTP 500）。
        - id: trade-app-verify
          uri: lb://wuling-trade-service
          predicates:
            - Path=/api/v1/app/workbench/store/*/verify-records,/api/v1/app/workbench/store/*/verify-pool,/api/v1/app/workbench/store/*/verify,/api/v1/app/workbench/store-operator/check
        # ---------- 商品服务（第 13 期拆分）----------
        # 顺序敏感：必须排在 /api/v1/** 通配之前。
        # 商品管理端与小程序菜单/详情，均为 product 域。
        - id: product-admin
          uri: lb://wuling-product-service
          predicates:
            - Path=/api/v1/admin/product/**
        - id: product-app
          uri: lb://wuling-product-service
          predicates:
            - Path=/api/v1/app/menu,/api/v1/app/products/**

        # ---------- 单体兜底（尚未拆分的域：财务 / 主体 / 系统）----------
        - id: legacy-server
          uri: lb://wuling-server
          predicates:
            - Path=/api/v1/**

      # 跨域（前端运营后台与小程序调试）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # 默认过滤器：去掉重复的响应头，避免下游与网关都设置导致前端解析异常
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

app:
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  jwt:
    # 与 auth-service / server 共用同一密钥；缺失时网关拒绝启动
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    org.springframework.cloud.gateway: INFO
    # 网关请求日志：入口方法/路径/查询串(脱敏)/耗时/状态码
    REQUEST: INFO
