# =============================================================
# 交易服务配置（第 7 期）
#
# 职责：订单、支付、核销、退款、订单超时。
# 端口 8084，由网关路由。
#
# 外部数据访问：
#   商品/门店/主体 -> server 的 /internal/** 只读接口（RemoteProductQueryAdapter）
#   结算状态       -> server 的 /internal/settlement-status（同步，防资金穿透）
#   分账/冲正      -> MQ 事件（finance 消费）
#   兑换核销       -> MQ 事件（marketing 消费）
# =============================================================
server:
  port: ${TRADE_SERVICE_PORT:8084}

spring:
  application:
    name: wuling-trade-service
  # ---------- 数据库连接池（P0 统一显式配置） ----------
  # 默认 Spring Boot 的 maximum-pool-size=10、connection-timeout=30s 在
  # 高并发下会导致「连接池耗尽 -> 30s 死等 -> 雪崩」。这里统一显式收紧：
  #   - connection-timeout 降到 3s：拿不到连接快速失败，而非长时间挂起；
  #   - maximum-pool-size 按单实例 20：与 Tomcat 默认 200 线程匹配的合理值；
  #   - minimum-idle 5：减少冷启动抖动。
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
      validation-timeout: 3000

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  # 事务内事件 outbox 扫描发布器（储值/优惠券/分账/冲正等最终一致事件）
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:1000}
    max-retries: ${OUTBOX_MAX_RETRIES:8}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    lock-timeout-ms: ${OUTBOX_LOCK_TIMEOUT_MS:300000}
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 3600000
    refresh-token-ttl: 604800000
  redis:
    mode: ${REDIS_MODE:single}
    database:
      auth: ${REDIS_DB_AUTH:0}
      sms: ${REDIS_DB_SMS:1}
      cache: ${REDIS_DB_CACHE:2}
      biz: ${REDIS_DB_BIZ:3}
  # 订单超时关单兜底扫描（P0：不依赖 MQ 的最终兜底，每分钟扫一次超 15 分钟未支付的 CREATED 订单）
  order-timeout-scan:
    enabled: true
    cron: '0 * * * * ?'
    batch-size: 200
  # 微信退款主动查询兜底（回调丢失时的最终兜底；mock 通道下 queryRefund 返回 null 自动跳过）
  # cron 默认每分钟一次（原 5 分钟）：微信退款结果通知可能未送达，用户侧感知延迟直接等于本间隔，
  # 缩短到 1 分钟可把「退款中」停留时间压到 1 分钟内。
  refund-reconcile:
    enabled: ${REFUND_RECONCILE_ENABLED:true}
    cron: ${REFUND_RECONCILE_CRON:0 */1 * * * ?}
    batch-size: ${REFUND_RECONCILE_BATCH_SIZE:100}
    # 退款单超过该分钟数仍未终态才主动查询：直接决定「退款中」停留时长，默认 1 分钟。
    query-after-minutes: ${REFUND_RECONCILE_QUERY_AFTER_MINUTES:1}
  # 退款受理后的即时重查（缩短「退款中」感知时长；微信回调未送达时的快速接管）
  refund:
    quick-recheck-enabled: ${REFUND_QUICK_RECHECK_ENABLED:true}
    quick-recheck-delay-ms: ${REFUND_QUICK_RECHECK_DELAY_MS:30000}
  mq:
    order-timeout-ms: ${MQ_ORDER_TIMEOUT_MS:900000}
    max-retry: ${MQ_MAX_RETRY:3}
    consumer-concurrency: ${MQ_CONSUMER_CONCURRENCY:2}
    prefetch-count: ${MQ_PREFETCH_COUNT:10}
  # ---------- 微信小程序（下单成功订阅消息）----------
  # app-id / app-secret 与 user-service 共用同一组环境变量，指向同一个小程序；
  # app-secret 缺失时只跳过订阅消息，不影响下单与支付。
  wx:
    app-id: ${WX_APP_ID:wx7d78d69cd175812e}
    app-secret: ${WX_APP_SECRET:}
    access-token-url: ${WX_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
    subscribe-send-url: ${WX_SUBSCRIBE_SEND_URL:https://api.weixin.qq.com/cgi-bin/message/subscribe/send}
    http-timeout-ms: ${WX_MINIAPP_HTTP_TIMEOUT_MS:3000}
    order-subscribe:
      # 总开关；本地 application-dev.yml 显式关闭，避免 mock 支付误发真实通知
      enabled: ${WX_ORDER_SUBSCRIBE_ENABLED:true}
      template-id: ${WX_ORDER_SUBSCRIBE_TEMPLATE_ID:W-_sFdE4DpQbfs5aeXASyEvVIVkFBYz65Qjl8lQQJWM}
      page: ${WX_ORDER_SUBSCRIBE_PAGE:pages/order-detail/order-detail}
      miniprogram-state: ${WX_ORDER_SUBSCRIBE_MINIPROGRAM_STATE:formal}
    mall-shipped-subscribe:
      enabled: ${WX_MALL_SHIPPED_SUBSCRIBE_ENABLED:true}
      template-id: ${WX_MALL_SHIPPED_TEMPLATE_ID:bxgB0GhwNBcC37qRILiRKOx5rxJWn7Phuw5ZaNB8lEI}
      page: ${WX_MALL_SHIPPED_PAGE:packageMall/pages/order-detail/order-detail}
      miniprogram-state: ${WX_MALL_SHIPPED_MINIPROGRAM_STATE:formal}
  mall:
    auto-complete:
      enabled: ${MALL_AUTO_COMPLETE_ENABLED:true}
      batch-size: ${MALL_AUTO_COMPLETE_BATCH_SIZE:200}
      cron: ${MALL_AUTO_COMPLETE_CRON:0 * * * * ?}
  # 内部服务调用（商品/结算查询），按服务名寻址
  internal:
    # 第 13 期：商品已拆为独立服务，商品类内部调用改指 product-service
    product-base: ${INTERNAL_PRODUCT_BASE:http://wuling-product-service}
    # subject / finance 等未拆域仍由 server 提供
    server-base: ${INTERNAL_SERVER_BASE:http://wuling-server}
    # 第 14 期：用户域内部调用（微信支付下单需查询 openid）
    user-base: ${INTERNAL_USER_BASE:http://wuling-user-service}
    # 第 15 期：营销域内部调用（会员价重算需查询等级折扣）
    marketing-base: ${INTERNAL_MARKETING_BASE:http://wuling-marketing-service}
    # 内部资金接口令牌：仅礼品卡内部接口请求逐次携带，保持空值时便于本地联调
    service-token: ${INTERNAL_SERVICE_TOKEN:}
  # ---------- 支付（第 14 期：微信支付接入）----------
  #
  # channel 决定生效的支付通道：
  #   mock  ：默认。下单即置为已支付，不产生真实资金流（本地开发 / CI / 备案前）
  #   wxpay ：微信支付 APIv3。需要商户资质、证书与【已备案的 https 回调域名】
  #
  # 【当前状态】域名尚未备案，故保持 mock。
  # 代码已全部就绪，备案完成后只需把 PAY_CHANNEL 改成 wxpay 并补齐下列变量：
  #   WXPAY_MCH_ID / WXPAY_APP_ID / WXPAY_API_V3_KEY / WXPAY_MCH_SERIAL_NO
  #   WXPAY_PRIVATE_KEY_PATH / WXPAY_PUBLIC_KEY_ID / WXPAY_PUBLIC_KEY_PATH
  #   WXPAY_NOTIFY_URL=https://api.wulingshiguang.top/api/v1/app/payments/wxpay/notify
  #
  # 安全：通道为 wxpay 时若缺任一配置/证书，WxPayProperties#validateOnStartup
  # 会让服务拒绝启动（fail-fast），避免带着无签名能力的通道上线。
  pay:
    # 支付通道：mock | wxpay（保持不变）
    channel: ${PAY_CHANNEL:mock}
    # 收款通道：新订单走哪个通道。wxpay | yeepay
    # 与 channel 解耦的原因：切换出款不应影响收款，
    # 且收款 Bean 被历史订单退款依赖（forPayment），不能按配置卸载。
    # 缺省回落 PAY_CHANNEL，保持既有部署行为。
    collect-channel: ${COLLECT_CHANNEL:${PAY_CHANNEL:mock}}
    # 储值模拟充值：仅 PAY_CHANNEL=mock 时生效，默认开启供联调，生产切真实支付前关闭
    stored-value-demo-enabled: ${STORED_VALUE_DEMO_ENABLED:true}
    # 内部网关回调签名密钥（/api/v1/app/payments/callback）
    # enabled=true 触发 PaymentSignConfig 生效：未注入密钥则拒绝启动
    enabled: true
    callback-secret: ${PAY_CALLBACK_SECRET:}
    callback-tolerance-ms: 300000

    # ---------- 微信支付 APIv3（第 14 期）----------
    # 全部由部署环境注入，仓库内不保存任何真实值
    wxpay:
      # 与 app.pay.channel 同值：SDK 相关 Bean 由该配置条件装配。
      # 保持 mock 时，本段以下配置即使为空也不会被读取，
      # 更不会向微信发起任何请求。
      channel: ${PAY_CHANNEL:mock}
      mch-id: ${WXPAY_MCH_ID:}
      app-id: ${WXPAY_APP_ID:}
      api-v3-key: ${WXPAY_API_V3_KEY:}
      merchant-serial-no: ${WXPAY_MCH_SERIAL_NO:}
      private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
      # 验签模式：public-key（微信支付公钥，新商户推荐）| platform-cert（平台证书）
      verify-mode: ${WXPAY_VERIFY_MODE:public-key}
      public-key-id: ${WXPAY_PUBLIC_KEY_ID:}
      public-key-path: ${WXPAY_PUBLIC_KEY_PATH:}
      # 回调地址必须是已备案的 https 域名（微信硬性要求）
      notify-url: ${WXPAY_NOTIFY_URL:}
      refund-notify-url: ${WXPAY_REFUND_NOTIFY_URL:https://api.wulingshiguang.top/api/v1/app/payments/wxpay/refund-notify}
      # 商家转账到零钱结果通知地址（第 16 期提现对接）
      payout-notify-url: ${WXPAY_PAYOUT_NOTIFY_URL:https://api.wulingshiguang.top/api/v1/app/payout/notify}
      # API 基地址；可用本地「假微信服务端」覆盖，做无商户号的端到端验证
      api-base-url: ${WXPAY_API_BASE_URL:https://api.mch.weixin.qq.com}
      # 回调时间戳允许漂移窗口（秒），防重放
      notify-tolerance-seconds: ${WXPAY_NOTIFY_TOLERANCE_SECONDS:300}
      http-timeout-ms: ${WXPAY_HTTP_TIMEOUT_MS:8000}
      # 收银台展示的商品描述前缀
      description-prefix: ${WXPAY_DESCRIPTION_PREFIX:五零时光}

    # ---------- 出款通道（独立于收款通道）----------
    # 为什么独立：微信收款 + 易宝出款需要长期并存。若与 PAY_CHANNEL 共用一个键，
    # 切换出款就必须动收款配置，而收款通道 Bean 被历史订单退款依赖，
    # 改配置会导致历史订单退款失败（PaymentGatewayResolver#forPayment 抛异常）。
    # 缺省回落到 app.pay.channel，保持既有部署行为不变。
    payout-channel: ${PAYOUT_CHANNEL:${PAY_CHANNEL:mock}}

    # ---------- 易宝支付（第 17 期，与微信完全独立）----------
    # 安全：channel=yeepay 时若缺 app-key / merchant-no / private-key，
    # YeepayProperties#validateOnStartup 会让服务拒绝启动（fail-fast）。
    # 留空时一个易宝 Bean 都不装配，不发起任何请求，线上零影响。
    #
    # 【配置来源已变更】app-key / merchant-no / platform-merchant-no /
    # private-key / yop-public-key 现在存在数据库
    # platform_profile.pay_config，由运营后台「平台主体」页维护，
    # trade-service 启动后经 /internal/platform/yeepay-config 拉取。
    # 下方环境变量仅作兜底（DB 未配置时才用），正常情况下留空即可。
    yeepay:
      channel: ${YEEPAY_CHANNEL:}
      app-key: ${YEEPAY_APP_KEY:}
      # 服务商主商编
      merchant-no: ${YEEPAY_MERCHANT_NO:}
      # 平台商商编：子商户入网时的 parentMerchantNo，分账发起方
      platform-merchant-no: ${YEEPAY_PLATFORM_MERCHANT_NO:}
      private-key: ${YEEPAY_PRIVATE_KEY:}
      yop-public-key: ${YEEPAY_YOP_PUBLIC_KEY:}
      notify-base-url: ${YEEPAY_NOTIFY_BASE_URL:https://api.wulingshiguang.top}
      # 分账间隔（毫秒）：易宝要求同订单两次分账间隔 2-3 秒
      divide-interval-ms: ${YEEPAY_DIVIDE_INTERVAL_MS:2500}
      sandbox: ${YEEPAY_SANDBOX:false}
      http-timeout-ms: ${YEEPAY_HTTP_TIMEOUT_MS:8000}

# 提现出款补偿任务（PROCESSING 单主动查单）
payout-reconcile:
  cron: ${PAYOUT_RECONCILE_CRON:0 */5 * * * ?}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    # 请求日志：每次调用的方法/路径/参数(脱敏)/耗时/状态码
    REQUEST: INFO
  # 日志输出格式：带 traceId 便于串联同一次调用的多行日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
