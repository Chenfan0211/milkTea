# =============================================================
# 文件服务配置（图片上传、重编码与公开读取）
# =============================================================
server:
  port: ${FILE_SERVICE_PORT:8082}

spring:
  application:
    name: wuling-file-service
  # ---------- Nacos 服务注册（第 3 期）----------
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  servlet:
    multipart:
      # 双层限制：网关层也会限制，这里兜底
      max-file-size: 5MB
      max-request-size: 6MB

app:
  # 请求日志开关（生产默认脱敏；排查时可临时置 true 输出全量参数，排查完务必关闭）
  log:
    request:
      full: ${LOG_REQUEST_FULL:false}
      max-body: ${LOG_REQUEST_MAX_BODY:2000}
  jwt:
    # 与 auth-service / gateway 共用同一密钥；生产环境必须通过 JWT_SECRET 注入
    secret: ${JWT_SECRET:}
  file:
    max-size-bytes: ${FILE_MAX_SIZE_BYTES:5242880}
    storage-root: ${FILE_STORAGE_ROOT:/data/wuling/uploads}
    public-base-url: ${FILE_PUBLIC_BASE_URL:/api/v1/files/public}
    max-dimension: ${FILE_MAX_IMAGE_DIMENSION:8000}
    max-pixels: ${FILE_MAX_IMAGE_PIXELS:40000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wuling: INFO
    # 请求日志：每次调用的方法/路径/参数(脱敏)/耗时/状态码
    REQUEST: INFO
  # 日志输出格式：带 traceId 便于串联同一次调用的多行日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"